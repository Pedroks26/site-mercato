<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 200" width="520" height="200">
  <defs>
    <style>
      .logo-mercato {
        font-family: 'Arial Black', 'Impact', sans-serif;
        font-size: 108px;
        font-weight: 900;
        fill: white;
        letter-spacing: -2px;
      }
      .logo-jardim {
        font-family: 'Georgia', 'Palatino Linotype', serif;
        font-size: 68px;
        font-weight: 400;
        font-style: italic;
        fill: white;
      }
    </style>
  </defs>

  <!-- MERCATO text -->
  <text x="10" y="108" class="logo-mercato">MERCATO</text>

  <!-- Lemon fruit -->
  <!-- Lemon body -->
  <ellipse cx="52" cy="162" rx="32" ry="24" fill="#F5C842" />
  <!-- Lemon highlight -->
  <ellipse cx="44" cy="152" rx="10" ry="7" fill="#FAE070" opacity="0.6" />
  <!-- Lemon tip left -->
  <ellipse cx="22" cy="162" rx="6" ry="5" fill="#E8B830" transform="rotate(-20 22 162)" />
  <!-- Lemon tip right -->
  <ellipse cx="82" cy="162" rx="6" ry="5" fill="#E8B830" transform="rotate(20 82 162)" />
  <!-- Leaf 1 -->
  <ellipse cx="38" cy="140" rx="14" ry="7" fill="#3A9A3A" transform="rotate(-35 38 140)" />
  <!-- Leaf 2 -->
  <ellipse cx="54" cy="136" rx="12" ry="6" fill="#2E8B2E" transform="rotate(-10 54 136)" />
  <!-- Leaf stem -->
  <line x1="46" y1="148" x2="46" y2="138" stroke="#2E6B2E" stroke-width="2" />

  <!-- Jardim text -->
  <text x="94" y="185" class="logo-jardim">Jardim</text>
</svg>
